<div class="page page--dark">
  <section class="container">
    <h2>Aktuelles</h2>
    <article *ngFor="let section of articles; let pIdx = index" [ngClass]="{even: pIdx % 2 === 0}">
      <h4 [id]="section.anchor">{{section.title}}</h4>
      <p class="date">Veröffentlicht am {{section.created}}</p>
      <figure *ngIf="section.image">
        <img [src]="section.image.url" [alt]="section.image.title">
      </figure>
      <ctf-rich-content *ngFor="let content of section.content" [content]="content"></ctf-rich-content>
    </article>
  </section>
</div>
